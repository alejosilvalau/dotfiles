# Change prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Tmux colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB"

# Basic status bar colors
set -g status-style bg=default

# Left side 
set -g status-left ""

# Window list colors
# Inactive window
setw -g window-status-style fg='#565f89',bg=default
setw -g window-status-format " #I:#W "

# Active window (Highlighted)
setw -g window-status-current-style fg='#ff9e64',bg='#24283b',bold
setw -g window-status-current-format " #[fg=#7aa2f7]#I#[fg=#a9b1d6]:#[fg=#ff9e64]#W "

# Right side
set -g @prefix_highlight_fg '#ff9e64'
set -g @prefix_highlight_bg 'default'

set -g status-right "#{?client_prefix,#[fg=#ff0000 bold]  #S,#[fg=#7aa2f7 bold]  #S}#[fg=#565f89]#{?#{!=:#{pane_current_command},},#(cd #{pane_current_path} && git branch --show-current 2>/dev/null | sed 's/.*/   󰘬 &/'),}"
set -g status-right-length 80

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
setw -g pane-base-index 1

# Optional: Renumber windows automatically when one is closed
set -g renumber-windows on

# Kitty Graphics support
set -g allow-passthrough on
set -g visual-activity off

# Set the escape-time to 0 or a very low value (in milliseconds)
set -s escape-time 0

# Refresh tmux configuration
unbind r
bind r source-file ~/.tmux.conf

# Kill window, session and server
bind-key q kill-window
bind-key C-q run-shell "tmux detach-client -a; tmux kill-server"

bind-key x run-shell "tmux kill-pane"
bind-key C-x kill-session

# Avoid detaching on session destroy
set -g detach-on-destroy off

# Resize panes
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5

bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Move windows left/right
bind-key < swap-window -t -1 \; previous-window
bind-key > swap-window -t +1 \; next-window

# Enable mouse support
set -g mouse on

# Vim keys for navigation between panes
bind -r ^ last-window
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Use vim keys in copy mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

unbind -T copy-mode-vi MouseDragEnd1Pane

# New window keeping current path
bind-key c new-window -c "#{pane_current_path}"

# New window on current path
bind-key C-c new-session -c "$HOME"

# Create a new session named after the current folder
bind-key C-s run-shell "tmux new-session -d -s $(basename #{pane_current_path}) -c #{pane_current_path} && tmux switch-client -t $(basename #{pane_current_path})"

# Fuzzy picker for new sessions
bind-key -r f run-shell "tmux neww tmux-sessionizer"

# Direct project jumps
bind-key -r A run-shell "tmux-sessionizer \"/media/$USER/Int. Media/AlnixDev/Projects\""
bind-key -r J run-shell "tmux-sessionizer \"/media/$USER/Int. Media/Job\""
bind-key -r D run-shell "tmux-sessionizer \"$HOME/Desktop/Job\""
bind-key -r S run-shell "tmux-sessionizer \"$HOME/dotfiles\""
bind-key -r N run-shell "tmux-sessionizer \"$HOME/.config/nvim\""

# Direct vault jump
bind-key -r V run-shell "tmux-sessionizer \"/media/$USER/Archive/AlnixDev/vault-alnix404\""
bind-key -r B run-shell "tmux-sessionizer \"/media/$USER/Archive/AlnixDev/vault-alnixdev\""
bind-key -r U run-shell "tmux-sessionizer \"/media/$USER/Archive/Job/vault-university\""
bind-key -r P run-shell "tmux-sessionizer \"/media/$USER/Archive/Personal/vault-personal\""
bind-key -r E run-shell "tmux-sessionizer \"$HOME/Desktop/vault-desktop\""

# Direct session jumps(M means alt)
bind-key b switch-client -T session-table
bind-key -T session-table a run-shell "tmux-sessionizer -s 0 --vsplit"
bind-key -T session-table 0 run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -T session-table 1 run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -T session-table 2 run-shell "tmux neww tmux-sessionizer -s 2"
bind-key -T session-table 3 run-shell "tmux neww tmux-sessionizer -s 3"
bind-key -T session-table 4 run-shell "tmux neww tmux-sessionizer -s 4"
bind-key -T session-table 5 run-shell "tmux neww tmux-sessionizer -s 5"
bind-key -T session-table 6 run-shell "tmux neww tmux-sessionizer -s 6"

# Tmux plugins
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-last-count '5'
set -g @resurrect-hook-post-save-all '~/.local/bin/clean-resurrect'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

run '~/.tmux/plugins/tpm/tpm'
